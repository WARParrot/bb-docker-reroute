name: ci

on:
  push:
    branches: [MAIN, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Shell syntax + hermetic test battery"
        run: bash tests/run-tests.sh
      - name: "Smoke: status emits valid JSON"
        run: |
          out=$(bash bin/bb-docker-route status)
          echo "$out" | python3 -m json.tool
          echo "$out"
